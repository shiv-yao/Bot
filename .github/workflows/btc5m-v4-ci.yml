name: BTC5M V4 Hardened CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Compile source tree
        run: python -m compileall -q src tests

      - name: Import V4 launcher
        run: |
          python - <<'PY'
          from polymarket_latency_bot import btc5m_event_main_v4 as v4
          payload = v4.build_mode_status()
          assert payload["strategy"] == "BTC_5M_EVENT_SCALE_IN_V4_HARDENED"
          assert payload["execution"] == "hardened_three_stage_scale_in_50_30_20"
          assert payload["safety"]["paper_only"] is True
          assert payload["safety"]["live_orders_enabled"] is False
          assert payload["safety"]["wallet_signing_enabled"] is False
          assert payload["safety"]["adaptive_cooldown_enabled"] is False
          PY

      - name: Run unit tests
        run: python -m unittest discover -s tests -v
