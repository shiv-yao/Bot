[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "polymarket-latency-bot"
version = "0.1.0"
description = "Paper-first Polymarket CLOB V2 latency strategy reference implementation"
requires-python = ">=3.11"
dependencies = [
  "aiohttp>=3.10,<4",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "websockets>=13,<16",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "python-dotenv>=1.0,<2",
  "py-clob-client-v2>=1.0,<2",
  "orjson>=3.10,<4",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
